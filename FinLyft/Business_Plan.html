## Executive Summary

Finlyft AI is a personal finance super-app for India. It uses the RBI's Account Aggregator (AA) framework to connect all of a user's financial accounts — bank accounts, loans, investments, credit cards — with a single consent tap, delivers a complete financial picture in real time, and provides CFP-grade financial advisory in Hindi and English via AI.

## 2. The problem

### 2.1 Fragmented financial data

The average urban Indian professional (earning ₹8–30L/year) has money spread across:
- 2–3 bank accounts (salary, savings, NRI)
- 1–3 active loans (home, personal, vehicle)
- 2–4 investment platforms (Groww, Zerodha, PPF, NPS)
- 1–3 credit cards

No single screen shows all of this at once. Each institution shows only what it holds. The user has never seen their net worth, total EMI burden, or combined XIRR — the numbers that actually drive financial decisions.

### 2.2 Advice gap

India has approximately 7,000 FPSB-certified financial planners and 1,300 SEBI-registered investment advisers for a population of 1.4 billion. (Source: FPSB India, SEBI, 2024) A CFP charges ₹2,000–8,000/hour. Most households cannot afford structured advice. The result: millions of Indians are overpaying on high-interest debt, underdiversified in investments, and underinsured — not because they don't care, but because they can't see the problem.

### 2.3 Loan over-indebtedness

Millions of Indians carry loans across 2–3 institutions simultaneously. They don't track combined EMI burden, don't know if their rate is competitive, and have never been told that consolidating 3 personal loans at 16–18% into one at 13% saves ₹4,200/month. (Source: TransUnion CIBIL Report, 2024)

## 3. The solution

### 3.1 Account Aggregator (AA) framework

The Reserve Bank of India's Account Aggregator framework (2021) allows users to share their financial data — bank statements, loan details, investment holdings, insurance — across institutions, with explicit digital consent, in real time. Finlyft AI registers as a Financial Information User (FIU) and uses this framework to pull all financial data into one screen with a single consent tap.

AA is:
- **Consent-based:** the user initiates every data share; can revoke at any time
- **Read-only:** no app can move or transact on money through AA; it only reads
- **Real-time:** data refreshes automatically, no manual entry
- **Regulated:** RBI-mandated; data travels through a licensed Account Aggregator intermediary

### 3.2 The product — 7 modules

**Day 0 — 6 license-free tools (Month 0–2, before app build completes):**

The AA app takes 3 months to build. Licenses (DSA, FIU, IRDAI POSP, AMFI ARN) take 2–3 months to process in parallel. The following 6 features are the entire Finlyft AI product for the first 3 months:
1. EMI calculator
2. SIP calculator
3. Loan eligibility calculator
4. Basic budgeting tool (user-entered data, no AA required)
5. Financial literacy content — blog and newsletter
6. Credit card affiliate links via EarnKaro, BankBazaar, CreditMantri

These generate credit card affiliate revenue from Day 1 (₹5–20K/month) and build the waitlist audience that converts to AA users at Month 3 beta launch.

**MVP (Month 3 — app build complete, licenses active):**
- Module 1 — Unified Financial Dashboard: all accounts, loans, investments, credit cards on one screen. Net worth, EMI burden, investment portfolio, cash flow — live from AA.
- Module 2 — AI Financial Advisor: conversational AI with full AA data context. Hindi + English. Specific and actionable. "Your HDFC card is charging 42% interest. You have ₹60K idle in savings. Paying it off saves ₹14,000 this year."

**Post-MVP (Month 7–12):**
- Module 3 — Loan Suite + Consolidation (Month 7)
- Module 4 — Financial Health Score (Month 8)
- Module 5 — Marketplace (Month 7–8; license-dependent)
- Module 6 — Goals Planner (Month 10)
- Module 7 — Investment Hub (Month 11)

## 8. Risk management

| Risk | Severity | Mitigation |
|---|---|---|
| Angel round delayed > 3 months | High | 100X.VC parallel application; Prashant stays employed until wire arrives; team costs ₹0 until funded |
| AA consent drop-off in onboarding | High | 3 onboarding flow A/B tests before scaling; one-tap consent, not form-based |
| LLM API costs spike at scale | Medium | FLM development starting Month 6 (training data collection); FLM deployed by Month 18 reduces API cost by 80% |
| Regulatory change to AA framework | Low | AA is RBI-mandated; 151 banks and ₹22L Cr in loan infrastructure depend on it; not reversible |
| DSA / AI advice regulatory conflict | Medium | All AI outputs framed as "information and options," never directives; one-line disclaimer on every response |
| Ops team bandwidth | Medium | Weekly hour commitment in agreements; Pratik, Ashish, and Shashi each commit minimum hours/week in writing |
| NBFC competition replicates product | Low-Medium | Speed to 5,000 users is the Year 1 moat; FLM trained on proprietary data is the Year 2 moat |

## 10. Exit / long-term vision

Year 3–5: The platform has 150,000+ MAU, a deployed fine-tuned model, and B2B NBFC white-label contracts. At this scale, Finlyft AI becomes an acquisition target for:
- Major banks seeking to add AA capabilities without building internally
- Larger fintech platforms (Groww, Zerodha, PhonePe) seeking a financial advisory layer
- Insurance companies seeking a direct distribution channel

Alternatively, Finlyft AI pursues a SEBI RIA license in Year 3, enabling direct investment advice — moving from information to execution, and from commission revenue to advisory AUM-based fees. This unlocks a materially higher revenue per user.

The long-term vision is not to be an app — it is to be the financial operating system for the Indian middle class.
