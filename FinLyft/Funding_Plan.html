    const md = `# Finlyft AI — Funding Plan

**Prepared:** August 2026 · Confidential
**Founder:** Prashant (CEO) · **Ops team:** Pratik · Ashish · Shashi

---

## Overview

Three funding stages across 24 months. Each stage has a specific purpose, a specific dilution target, and a specific milestone it must produce to justify the next raise.

| Stage | Amount | Dilution | Timeline | Purpose |
|---|---|---|---|---|
| Angel round | ₹75L–1Cr | 10–15% | Month 1–3 | Runway to MVP + 500 users |
| Accelerator (optional) | Non-dilutive or ≤12% | — | Month 3–6 | Validation + network |
| Seed round | ₹3–5Cr | 15–20% | Month 10–12 | Scale to 5,000 MAU + FLM |
| Series A (Year 2–3) | ₹15–25Cr | 18–22% | Month 24–30 | B2B white-label + FLM self-hosting |

---

## Round 1 — Angel

### Target
₹75L–1Cr at a post-money valuation of ₹6–8Cr (implied 10–15% dilution).

At this stage, the company has:
- Day 0 calculator website live with 6 license-free features earning credit card affiliate revenue
- Working prototype (Setu sandbox — AA integration in development)
- DPIIT recognition
- DSA, IRDAI POSP, FIU, and AMFI ARN registrations all in progress (applied for in Month 0)
- Team of four with consulting agreements signed
- 1,000+ waitlist signups from organic calculator traffic

The valuation is supported by: technical team assembled, regulatory clarity established, IP filed, and a whitespace in a market validated by Sahamati data (252M users, 435 FIUs, zero consumer apps).

### Use of funds

| Item | Amount | Notes |
|---|---|---|
| Salaries — all 4 at ₹50K/month × 12 months | ₹24L | Survival salary; steps up at seed close |
| AWS + LLM API costs | ₹5L | Setu, Firebase, OpenAI/Anthropic APIs |
| Legal + compliance | ₹10L | FIU registration, CA, agreements, patent, eKYC integration |
| User acquisition | ₹20L | Referral program, CA partnerships, 1–2 influencer deals |
| Buffer / runway | ₹11–16L | 2–3 month safety margin |
| **Total** | **₹70–75L** | |

### Target investors

| Investor / Network | Type | Cheque size | Approach |
|---|---|---|---|
| 100X.VC | Accelerator-angel | ₹25L (1% SAFE) | Apply at 100x.vc — rolling, zero traction needed |
| Mumbai Angels | Angel network | ₹25L–1Cr | Warm intro preferred; direct application also works |
| Indian Angel Network (IAN) | Angel network | ₹25L–2Cr | iangroupindia.com — submit detailed deck |
| LetsVenture | Online platform | ₹10L–2Cr | Create profile, upload deck — reaches many angels simultaneously |
| Ah! Ventures | Angel network | ₹10L–50L | Pune-based; Prashant has warm network here |
| Fintech operator angels | Individual | ₹10L–1Cr | Kunal Shah (CRED), Jitendra Gupta (Jupiter), Nitin Gupta (Uni) — LinkedIn + warm intro |

### Pitch narrative

The 60-second version:

> "500 million Indians manage money across 7 apps. The RBI built the pipes — Account Aggregator — to fix this. 252 million users are already linked. 151 banks are live. 435 FIUs are registered. Almost all of them serve B2B lenders, not consumers. Finlyft AI is building the consumer product that's been missing. We launched Day 1 with 6 calculator tools on a landing page — we're already earning credit card affiliate commissions while the app is being built. Month 3, the AA dashboard and AI advisor go live. One consent tap, all accounts on one screen, an AI that tells you exactly what to do — in Hindi and English. DSA commissions start the day the app launches. We're raising ₹75L–1Cr to get from sandbox to 500 active AA users."

The deck must demonstrate:
1. The AA infrastructure is live and the consumer gap is real (Sahamati data)
2. The team can build it (React Native, Node.js, Setu SDK experience)
3. Revenue starts immediately, not at Series B (DSA commissions from Month 3)
4. There is a moat in Year 2 (FLM — fine-tuned model on proprietary data)

### Angel tax protection

DPIIT recognition (applied in Month 0, Week 4) eliminates Angel Tax liability under Section 56(2)(viib). This must be confirmed before any term sheet is signed. Angels will ask.

---

## Round 1B — Accelerator (parallel track)

Apply to these simultaneously with the angel round. Accelerator acceptance makes angel conversations easier and reduces dilution pressure. Some accelerators replace part of the angel round.

### Antler India — primary target

- Investment: ₹4Cr for 11% equity + ₹2L grant + $1M Azure credits
- Stage: Idea to early stage; AI-first preferred
- Residency: Full-time for the cohort duration (~6 months)
- Why it fits: AI-first mandate, early stage, full-time model — exact match
- Apply: antler.co/location/india — watch cohort dates
- If accepted: reduces angel round to ₹25–50L (top-up only); Azure credits replace AWS costs entirely

### 100X.VC — backup / parallel

- Investment: ₹25L for 1% SAFE
- Stage: Pre-revenue, pre-product — zero traction required
- Rolling applications: 100x.vc
- Why it fits: Simple terms, rolling timeline, no cohort dependency

### Google for Startups Accelerator

- Investment: Equity-free; Google Cloud credits + mentorship
- AI-focused cohort
- Apply when operational (Month 6+); traction helps but not required
- No dilution — apply regardless of other rounds

---

## Round 2 — Seed

### Target
₹3–5Cr at a post-money valuation of ₹20–30Cr (implied 15–20% dilution).

This round is raised at Month 10–12, when the company has:
- 5,000+ MAU with active AA connections
- ₹5–8L/month revenue (DSA + marketplace + POSP)
- FLM training dataset at 50,000+ examples
- 2–3 NBFC conversations for B2B pipeline

### Use of funds

| Item | Amount | Notes |
|---|---|---|
| Salaries — all 4 at ₹1L/month × 18 months | ₹72L | Step-up clause triggers at seed close |
| FLM fine-tuning + self-hosting | ₹5L | AWS SageMaker compute, one-time |
| Paid acquisition scale-up | ₹40L | Google + Meta ads, influencer deals — CAC validated before scaling |
| Goals Planner + Investment Hub build | ₹10L | Modules 6 + 7 engineering |
| SEBI RIA feasibility + legal | ₹8L | Year 2 investment advice preparation |
| NBFC enterprise sales | ₹10L | BD for white-label pipeline |
| Infrastructure + ops | ₹15L | AWS Mumbai scale-up for 20,000 MAU |
| Buffer | ₹15–20L | |
| **Total** | **~₹1.75–1.8Cr base + buffer** | Raise ₹3–5Cr for 18–24 months runway |

### Target investors

| Investor | Type | Why |
|---|---|---|
| Surge (Peak XV / Sequoia) | Accelerator-seed | $1–3M for ~7–10%. Most well-known in India. Apply at Month 10 — traction threshold should be met. |
| Blume Ventures | Seed VC | Active in fintech. Backed Slice, Smallcase. ₹1–3Cr typical cheque. |
| Prime Venture Partners | Seed VC | Strong B2C India focus. Backed Happay, Quikr. |
| Elevation Capital | Seed-Series A | Backed CRED, Meesho. Larger cheques (₹2–5Cr) possible. |
| WEH Ventures | Seed VC | Women-led fintech investor — relevant given consumer focus |
| Artha Ventures | Seed VC | Pune-based fintech focus — warm network advantage |

### Seed pitch narrative

At Month 12, the story changes from "trust us" to "look at the numbers":

> "We said 500 users by Month 6 and ₹1–3L/month revenue. We hit [X] users and [Y] revenue. We said 5,000 by Month 12. We're at [Z]. The DSA commission per user is [A]. AA consent conversion is [B]%. LLM API costs are [C] per user per month — we have a fine-tuned model in development that drops this by 80%. We're raising ₹3–5Cr to take it to 50,000 MAU, launch the white-label NBFC product, and deploy the FLM. The seed pitch is: we proved the market, now we scale the economics."

---

## Cap table — dilution waterfall

Starting from 100% to Series A:

| Round | New shares | Investor % | Founder % after |
|---|---|---|---|
| Pre-money | — | — | Prashant: 80%, ESOP: 10%, Reserved: 10% |
| Angel (12%) | ~13.6% dilution | Angels: 12% | Prashant: ~70.4%, ESOP: 8.8%, Reserved: 8.8% |
| Seed (17%) | ~20.5% dilution | Seed VC: 17% | Prashant: ~58.5%, ESOP: 7.3%, Angels: ~10% |
| Series A (20%) | ~25% dilution | Series A: 20% | Prashant: ~46.8%, others proportional |

Prashant retains ~47% by Series A — majority control preserved through Series A at standard dilution.

---

## Funding risks

| Risk | Mitigation |
|---|---|
| Angel round takes 4+ months | Run 100X.VC application in parallel. Prashant stays employed until wire arrives. Keep team costs at zero until funded. |
| Accelerator not accepted | Angel round is the primary path; accelerator is additive, not dependent. |
| Seed traction below threshold | If MAU < 3,000 at Month 12, delay seed; extend angel runway with 2–3 months of revenue buffer. Cut paid acquisition burn. |
| Valuation expectations misaligned | Pre-seed comps for India fintech (no revenue): ₹5–10Cr post-money. At ₹1–3L/month revenue: ₹15–25Cr is defensible. Don't take a down round from the angel. |
| Dilution stack too high from accelerator | If Antler takes 11%, cap total pre-seed dilution at 20% combined (angel + accelerator). Leave room for seed. |

---
