    const md = `# Finlyft AI — Upekkha Application Plan

**Prepared:** August 2026 · Confidential

---

## What is Upekkha

Upekkha is a B2B SaaS accelerator based in Bangalore, India. It runs a cohort program for India-first B2B SaaS founders, with a focus on founders selling to international markets from India. Notable portfolio: Chargebee, WebEngage, Whatfix, Kissflow, Zluri.

Key terms (as of 2025):
- Investment: $100K for 7% equity
- Program: 6-month structured cohort
- Focus: Revenue, customer discovery, international expansion
- Stage: Pre-seed to early seed; some revenue preferred

Website: upekkha.io · Applications: rolling

---

## Is Upekkha the right fit?

Upekkha focuses on B2B SaaS — companies that sell software subscriptions to businesses, not consumers.

Finlyft AI Year 1 is a B2C product. The direct answer is: **Upekkha is not the right accelerator for Year 1.**

However, Finlyft AI has a B2B white-label opportunity in Year 2 that changes the picture significantly. NBFCs and banks will pay to embed Finlyft AI's financial dashboard and AI advisor as a branded experience for their customers. This is a high-value B2B SaaS contract: ₹50–200K/month per institution, multi-year, sticky.

**Recommended timing: Apply to Upekkha in Year 2 (Month 18–24), once the B2B NBFC pipeline has 2–3 qualified conversations.**

---

## Year 2 B2B white-label thesis

### What the product becomes

A NBFC or bank can embed Finlyft AI's AA-powered financial dashboard + AI advisor into their own mobile app or web platform. Their customers get:
- A complete view of their financial accounts (including competitors' accounts — AA is consent-based, not institution-restricted)
- An AI advisor that knows their real numbers
- Loan refinancing and consolidation recommendations that route to the bank's own products first

The NBFC benefits: increased engagement, upsell opportunity, reduced churn from customers who would otherwise move to a competitor offering AA features.

### Why NBFCs pay for this

- Building their own AA FIU registration and AI advisor: 12–18 months, ₹2–3Cr in engineering costs
- Finlyft AI's white-label: live in 6–8 weeks (API integration), recurring contract

### Revenue model for white-label

| Tier | Monthly fee | What's included |
|---|---|---|
| Starter | ₹50K/month | Dashboard + basic AI advisor, up to 5,000 end users |
| Growth | ₹1.5L/month | Full AI advisor + proactive alerts + up to 25,000 end users |
| Enterprise | ₹3–5L/month | Custom branding, dedicated model fine-tuning, SLA, unlimited users |

Three enterprise contracts = ₹9–15L/month — a business unit that materially shifts the seed story.

---

## What to position in the Upekkha application

When applying (Year 2), position Finlyft AI as a **B2B financial intelligence platform for NBFCs and banks** — not as a consumer app.

The Upekkha application will ask:

**"What do you sell, and to whom?"**
> Finlyft AI sells a white-label Account Aggregator financial dashboard and AI advisory platform to NBFCs and banks. Customers embed our product into their existing mobile apps and web platforms. We charge a monthly SaaS fee per institution based on end-user volume. Our consumer app (40,000+ users, ₹8L/month revenue) is the product proof — the enterprise version is the same platform with custom branding and a dedicated model fine-tuning layer.

**"What is your current ARR?"**
> At the time of application (Year 2), target ARR: ₹1.5–2Cr (consumer subscriptions + first 2–3 NBFC contracts). Provide actuals.

**"Who are your current paying customers?"**
> [NBFC name redacted] — ₹50K/month white-label contract. [2nd NBFC] — in POC. Consumer: 40,000+ registered users, 5,000+ AA-connected MAU, premium tier at ₹199–499/month.

**"What's your go-to-market for enterprise?"**
> Direct BD outreach to Tier-2 and Tier-3 NBFCs that lack the engineering capacity to build their own AA integration. Target: NBFC loan books of ₹500Cr–₹5,000Cr — large enough to value customer engagement tools, small enough to move fast on procurement. Sales cycle: 3–6 months. Prashant leads BD; we hire one enterprise sales person post-seed.

---

## What Upekkha provides that's relevant

- **Customer discovery framework:** structured approach to validating NBFC willingness-to-pay before building custom enterprise features — avoids building bespoke integrations for prospects who never sign
- **Pricing strategy:** Upekkha has deep expertise in B2B SaaS pricing in India — useful for positioning the white-label tiers
- **International expansion:** While Year 2 is India-only, the playbook may apply to Southeast Asia (similar AA frameworks being built in Indonesia, Philippines). Upekkha's network in SEA fintech is valuable for Year 3.
- **Portfolio network:** Chargebee, Kissflow, Whatfix are all potential indirect enterprise partners or reference customers

---

## Application checklist (when ready — Year 2)

- [ ] 2–3 NBFC conversations active (at least 1 signed or in LOI)
- [ ] Consumer ARR > ₹1Cr (subscription revenue, not commissions)
- [ ] FLM deployed — "our own model" is a strong differentiator vs. GPT wrapper
- [ ] Deck positioning is B2B SaaS, not consumer app
- [ ] Prashant has 30-minute reference calls available from 2 NBFC contacts
- [ ] Apply at upekkha.io (rolling applications; no batch cycle)

---

## Alternative accelerators for the B2B track (Year 2)

| Accelerator | Why | When to apply |
|---|---|---|
| YC (Y Combinator) | Global reach, brand name, $500K for 7% | Year 2 — apply Jan or Sep batch; need NBFC traction |
| Sequoia Surge (Peak XV) | India-focused, $1–3M, strong FinTech portfolio | Year 2 — apply once seed metrics confirmed |
| Techstars Bangalore | B2B SaaS focus, mentor network | Year 2 — 90-day cohort |
| SaaSBoomi | India B2B SaaS community (not an accelerator but the best network in India for this) | Join immediately — free, community-driven |
