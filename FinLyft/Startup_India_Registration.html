**Prepared:** August 2026 · Confidential
**Entity:** Finlyft AI Private Limited (pending registration)

---

## Why apply

DPIIT recognition unlocks:
- Self-certification of compliance under 9 labour laws and 3 environmental laws — no inspections for 3 years
- Simplified patent application process + 80% rebate on filing fees
- 100% income tax exemption for 3 consecutive years out of first 10 years (under Section 80-IAC, pending approval)
- Exemption from Angel Tax (Section 56(2)(viib)) — critical for angel round at fair-market-value premium
- Fast-track insolvency resolution (90 days vs. 270 days)
- Government tender eligibility without prior turnover requirement
- Access to Startup India Fund of Funds (₹10,000 Cr corpus via SIDBI)
- Access to state-level startup schemes (Maharashtra has a dedicated ₹200 Cr startup fund)

The Angel Tax exemption is the most immediately valuable: without it, any angel investment above fair market value triggers a tax on the company as "income from other sources." This kills most angel rounds in India. DPIIT recognition removes this risk entirely.

---

## Eligibility criteria

Finlyft AI qualifies on all counts:

| Criterion | Requirement | Status |
|---|---|---|
| Entity type | Private Limited, LLP, or Partnership | Private Limited (registering) |
| Age | Incorporated within last 10 years | Month 0 — qualifies |
| Turnover | Under ₹100 Cr in any financial year | ₹0 — qualifies |
| Innovation | Working on novel product/process or technology platform | AA + AI finance advisory — qualifies |
| Scalable | High potential for employment/wealth creation | ✓ |

---

## Application process

### Step 1 — Company registration (prerequisite)
Private Limited registration on MCA21 must be complete before applying. CIN (Corporate Identification Number) is required for the DPIIT form.

Timeline: 2–3 weeks with CA. Budget: ₹15–25K.

### Step 2 — Apply at startupindia.gov.in

1. Go to startupindia.gov.in → "Get DPIIT Recognised"
2. Register as a new user using the company's registered email
3. Fill Form 1 — entity details, incorporation date, PAN, CIN
4. Fill Form 2 — nature of business, products/services, innovation description
5. Upload required documents (listed below)
6. Submit → receive acknowledgement

Processing time: 2–10 working days. The process is entirely online; no physical visit required.

### Step 3 — 80-IAC tax exemption (separate application)

DPIIT recognition is automatic after Form 1+2. The 3-year income tax exemption requires a separate Inter-Ministerial Board (IMB) certificate under Section 80-IAC. Apply once the company has 1-2 years of operational history and is approaching profitability. No action needed at incorporation.

---

## Documents required

| Document | Notes |
|---|---|
| Certificate of Incorporation | From MCA21 — available within 1 week of registration |
| PAN card of company | Available same day as incorporation |
| Proof of concept / pitch deck | Upload the Finlyft AI pitch deck — 10 slides, 5 MB max |
| Brief description of innovation | 500-word description of the AA + AI advisor architecture and what makes it novel |
| Director/founder Aadhaar + PAN | For all directors |
| Company's MOA + AOA | From MCA21 registration |

All documents can be uploaded as PDFs directly on the portal. No notarisation required.

---

## What to write in the innovation description

This is the most important part of the application. The portal asks: "Please describe the innovative nature of your product/service/business model."

Suggested text (adapt as needed):

> Finlyft AI is building India's first consumer-facing Account Aggregator application — a personal finance super-app that connects all of a user's financial accounts (bank accounts, loans, investments, credit cards) through the RBI's AA framework with a single consent tap, and delivers CFP-grade financial advisory in Hindi and English via a domain-specific AI system.
>
> The innovation has three components: (1) Consumer AA interface — while 435 FIUs are registered under the AA framework, nearly all serve B2B lenders; Finlyft AI is among the first to build a consumer product on top of the AA pipes. (2) Multilingual financial AI — a fine-tuned language model trained specifically on Indian personal finance data (PPF, NPS, ELSS, Section 80C, Hindi-English code-switching), delivering specific and actionable advice rather than generic guidance. (3) Integrated financial health scoring — a proprietary composite score that reflects a user's complete financial picture, combining data across all connected institutions in real time.
>
> The platform addresses a genuine market gap: India has 7,000 SEBI-registered financial planners for 1.4 billion people, and CFP advisory starts at ₹2,000/hour — inaccessible to most. Finlyft AI democratises access to quality financial advisory at ₹1/query scale.

---

| Action | Owner | Month |
|---|---|---|
| Company registered (CIN received) | Prashant + CA | Month 0, Week 4 |
| DPIIT application submitted | Prashant | Month 0, Week 4 (same week as CIN) |

| Angel Tax exemption in effect | — | Effective from recognition date |
| 80-IAC IMB application | Prashant | Year 2 (once operational) |

---

## State-level schemes to apply alongside

Maharashtra Startup Policy 2023-28 offers:
- ₹5L seed grant for eligible startups
- 100% stamp duty waiver on first office lease
- Patent filing assistance up to ₹2L

Apply at mahaswayam.gov.in after DPIIT recognition is received. DPIIT recognition is a prerequisite for most Maharashtra state schemes.
